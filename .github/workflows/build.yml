name: Build XR30 NAND (mtwifi 6.6)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'xr30-nand-mtwifi.config'
      - 'diy-part2.sh'

env:
  # 底座: padavanonly/immortalwrt-mt798x-6.6 (ImmortalWrt 24.10, 内核 6.6, MTK mtwifi 闭源)
  # 已原生合入 cmcc_xr30-nand，无需额外 fork / 设备树补丁
  REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  BRANCH: openwrt-24.10-6.6

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (this build repo)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone source
        run: |
          git clone --depth=1 -b "$BRANCH" "$REPO" openwrt
          cd openwrt
          # 额外 feed：iStore / QModem / OpenClash
          echo "src-git istore https://github.com/istoreos/istore;main" >> feeds.conf.default
          echo "src-git qmodem https://github.com/FUjr/modem_feeds.git;main" >> feeds.conf.default
          echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config & diy
        run: |
          cd openwrt
          cp ../xr30-nand-mtwifi.config .config
          chmod +x ../diy-part2.sh
          bash ../diy-part2.sh
          make defconfig

      - name: Download packages
        run: cd openwrt && make download -j8

      - name: Build
        run: cd openwrt && make -j$(nproc) || make -j1 V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr30-nand-mtwifi-6.6
          path: openwrt/bin/targets/mediatek/mt7981/
